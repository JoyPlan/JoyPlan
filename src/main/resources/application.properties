spring.application.name=JoyPlan
server.port=${PORT:8080}
spring.datasource.url=jdbc:h2:file:./data/joyplan;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.thymeleaf.cache=false
spring.mvc.format.date=iso
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
joyplan.ai.api-key=${GEMINI_API_KEY:}
joyplan.ai.model=${GEMINI_MODEL:gemini-2.5-flash}
joyplan.ai.timeout-seconds=20
