<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Create account')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<main class="container py-5 jp-narrow">
    <div class="card jp-card p-4">
        <h1 class="h3 mb-3">Create your JoyPlan account</h1>
        <form th:action="@{/register}" th:object="${form}" method="post" novalidate>
            <div class="mb-3">
                <label for="displayName" class="form-label">Your name</label>
                <input type="text" th:field="*{displayName}" class="form-control" th:classappend="${#fields.hasErrors('displayName')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{displayName}"></div>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" th:field="*{email}" class="form-control" autocomplete="username" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{email}"></div>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" th:field="*{password}" class="form-control" autocomplete="new-password" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                <div class="form-text">At least 8 characters with letters and numbers.</div>
                <div class="invalid-feedback" th:errors="*{password}"></div>
            </div>
            <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm password</label>
                <input type="password" th:field="*{confirmPassword}" class="form-control" autocomplete="new-password" th:classappend="${#fields.hasErrors('passwordConfirmed')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{passwordConfirmed}"></div>
            </div>
            <div class="mb-3">
                <label for="homeArea" class="form-label">Home area</label>
                <select th:field="*{homeArea}" class="form-select">
                    <option th:each="a : ${areas}" th:value="${a}" th:text="${a.label}">Area</option>
                </select>
            </div>
            <p class="small text-muted">We only store your children's ages, interests and food preferences – no names or photos. You can delete everything at any time.</p>
            <button type="submit" class="btn jp-btn-primary w-100">Create account</button>
        </form>
        <p class="mt-3 mb-0 small">Already registered? <a th:href="@{/login}">Sign in</a></p>
    </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
