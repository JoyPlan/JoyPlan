<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Sign in')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<main class="container py-5 jp-narrow">
    <div th:replace="~{fragments :: flash}"></div>
    <div class="card jp-card p-4">
        <h1 class="h3 mb-3">Sign in to JoyPlan</h1>
        <div th:if="${param.error}" class="alert alert-danger" role="alert">Invalid email or password.</div>
        <div th:if="${param.logout}" class="alert alert-info" role="status">You have been signed out.</div>
        <div th:if="${param.deleted}" class="alert alert-info" role="status">Your account and all family data were deleted.</div>
        <form th:action="@{/login}" method="post" novalidate>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" name="email" class="form-control" autocomplete="username" required autofocus>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn jp-btn-primary w-100">Sign in</button>
        </form>
        <p class="mt-3 mb-0 small">New to JoyPlan? <a th:href="@{/register}">Create an account</a></p>
    </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
