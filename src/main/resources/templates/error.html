<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Something went wrong')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<main class="container py-5 jp-narrow text-center">
    <h1 class="display-6" th:text="${status == 404} ? 'Page not found' : (${status == 403} ? 'Access denied' : 'Something went wrong')">Error</h1>
    <p class="text-muted" th:text="${status == 403} ? 'You do not have permission to view this page.' : 'Please go back and try again.'">Message</p>
    <a class="btn jp-btn-primary" th:href="@{/dashboard}">Back to dashboard</a>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
