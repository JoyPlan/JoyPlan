<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Venue')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<main class="container py-4 jp-medium">
    <a th:href="@{/admin/venues}" class="small">&larr; Back to venues</a>
    <h1 class="h3 mt-2" th:text="${venue.id == null} ? 'Add venue' : 'Edit venue'">Venue</h1>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <form th:action="@{/admin/venues}" th:object="${venue}" method="post" class="card jp-card p-4" novalidate>
        <input type="hidden" th:field="*{id}">
        <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger">Please correct the highlighted fields.</div>
        <div class="row g-3">
            <div class="col-md-8">
                <label for="name" class="form-label">Name</label>
                <input th:field="*{name}" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{name}"></div>
            </div>
            <div class="col-md-4">
                <label for="category" class="form-label">Category</label>
                <select th:field="*{category}" class="form-select">
                    <option th:each="c : ${categories}" th:value="${c}" th:text="${c.label}">Cat</option>
                </select>
            </div>
            <div class="col-md-4">
                <label for="setting" class="form-label">Setting</label>
                <select th:field="*{setting}" class="form-select" th:classappend="${#fields.hasErrors('setting')} ? 'is-invalid'">
                    <option th:each="s : ${settings}" th:value="${s}" th:text="${s.label}">Indoor</option>
                </select>
            </div>
            <div class="col-md-4">
                <label for="area" class="form-label">Area</label>
                <select th:field="*{area}" class="form-select" th:classappend="${#fields.hasErrors('area')} ? 'is-invalid'">
                    <option th:each="a : ${areas}" th:value="${a}" th:text="${a.label}">Area</option>
                </select>
            </div>
            <div class="col-md-4">
                <label for="energyLevel" class="form-label">Energy level</label>
                <select th:field="*{energyLevel}" class="form-select">
                    <option th:each="e : ${energyLevels}" th:value="${e}" th:text="${e.label}">Low</option>
                </select>
            </div>
            <div class="col-md-12">
                <label for="address" class="form-label">Address</label>
                <input th:field="*{address}" class="form-control">
            </div>
            <div class="col-md-3">
                <label for="latitude" class="form-label">Latitude</label>
                <input type="number" step="0.000001" th:field="*{latitude}" class="form-control" th:classappend="${#fields.hasErrors('latitude')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{latitude}"></div>
            </div>
            <div class="col-md-3">
                <label for="longitude" class="form-label">Longitude</label>
                <input type="number" step="0.000001" th:field="*{longitude}" class="form-control" th:classappend="${#fields.hasErrors('longitude')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{longitude}"></div>
            </div>
            <div class="col-md-3">
                <label for="minAge" class="form-label">Min age</label>
                <input type="number" min="0" max="17" th:field="*{minAge}" class="form-control" th:classappend="${#fields.hasErrors('minAge')} ? 'is-invalid'">
            </div>
            <div class="col-md-3">
                <label for="maxAge" class="form-label">Max age</label>
                <input type="number" min="0" max="17" th:field="*{maxAge}" class="form-control" th:classappend="${#fields.hasErrors('maxAge')} ? 'is-invalid'">
            </div>
            <div class="col-md-3">
                <label for="priceAdult" class="form-label">Adult price (AED)</label>
                <input type="number" min="0" th:field="*{priceAdult}" class="form-control" th:classappend="${#fields.hasErrors('priceAdult')} ? 'is-invalid'">
            </div>
            <div class="col-md-3">
                <label for="priceChild" class="form-label">Child price (AED)</label>
                <input type="number" min="0" th:field="*{priceChild}" class="form-control" th:classappend="${#fields.hasErrors('priceChild')} ? 'is-invalid'">
            </div>
            <div class="col-md-2">
                <label for="durationMinutes" class="form-label">Minutes</label>
                <input type="number" min="10" max="480" th:field="*{durationMinutes}" class="form-control" th:classappend="${#fields.hasErrors('durationMinutes')} ? 'is-invalid'">
            </div>
            <div class="col-md-2">
                <label for="openTime" class="form-label">Opens</label>
                <input type="time" th:field="*{openTime}" class="form-control">
            </div>
            <div class="col-md-2">
                <label for="closeTime" class="form-label">Closes</label>
                <input type="time" th:field="*{closeTime}" class="form-control">
            </div>
            <div class="col-md-6">
                <fieldset>
                    <legend class="form-label fs-6">Interests (activities)</legend>
                    <div class="jp-check-grid">
                        <div class="form-check" th:each="i : ${interestOptions}">
                            <input class="form-check-input" type="checkbox" th:field="*{interests}" th:value="${i}">
                            <label class="form-check-label" th:for="${#ids.prev('interests')}" th:text="${i.label}">I</label>
                        </div>
                    </div>
                </fieldset>
            </div>
            <div class="col-md-6">
                <fieldset>
                    <legend class="form-label fs-6">Food tags (meals and snacks)</legend>
                    <div class="jp-check-grid">
                        <div class="form-check" th:each="f : ${foodOptions}">
                            <input class="form-check-input" type="checkbox" th:field="*{foodTags}" th:value="${f}">
                            <label class="form-check-label" th:for="${#ids.prev('foodTags')}" th:text="${f.label}">F</label>
                        </div>
                    </div>
                </fieldset>
            </div>
            <div class="col-md-12">
                <label for="description" class="form-label">Description</label>
                <textarea th:field="*{description}" rows="2" maxlength="500" class="form-control"></textarea>
            </div>
            <div class="col-md-6">
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" th:field="*{sponsored}">
                    <label class="form-check-label" th:for="${#ids.prev('sponsored')}">Sponsored listing (always labelled to parents)</label>
                </div>
            </div>
            <div class="col-md-6">
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" th:field="*{active}">
                    <label class="form-check-label" th:for="${#ids.prev('active')}">Active (used in recommendations)</label>
                </div>
            </div>
        </div>
        <button type="submit" class="btn jp-btn-primary mt-4">Save and mark verified</button>
    </form>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
